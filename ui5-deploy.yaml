# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zppbomupload
type: application
builder:
  customTasks:
    - name: ui5-tooling-modules-task
      afterTask: replaceVersion
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DS4-100
          url: http://sapdev.sap.tanmiah.com:443
          client: '100'
        app:
          name: ZPPBOMUPLOAD
          description: BOM Upload
          package: ZFIORIDEV
          transport: DS4K901742
        exclude:
          - /test/
          - /localService/

  resources:
    excludes:
      - /test/**
      - /localService/**
